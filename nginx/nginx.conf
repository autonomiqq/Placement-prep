worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip for API responses and static assets
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Buffer tuning
    proxy_buffer_size   16k;
    proxy_buffers       8 16k;
    proxy_busy_buffers_size 32k;

    # Use Docker's internal DNS — re-resolves on every request to pick up scaled instances
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Rate limit zones (burst protection at nginx level)
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=exam:10m  rate=10r/s;

    server {
        listen 80;
        server_name _;

        # Allow large CSV uploads
        client_max_body_size 20M;

        # Health check — no rate limit, no logging
        location = /api/health {
            set $upstream "web:3000";
            proxy_pass http://$upstream;
            access_log off;
        }

        # Question bank bulk generation — SSE stream, no buffering, very long timeout
        location = /api/admin/question-bank/generate {
            set $upstream "web:3000";
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # AI question generation — SSE stream, no buffering, long timeout
        location = /api/ai/generate-questions {
            set $upstream "web:3000";
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # Answer save / flush — moderate rate limit
        location ~ ^/api/tests/.+/answers {
            limit_req zone=exam burst=20 nodelay;
            set $upstream "web:3000";
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # All other API routes
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            set $upstream "web:3000";
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Long timeout for AI streaming routes
            proxy_read_timeout 300s;
        }

        # Next.js pages + static
        location / {
            set $upstream "web:3000";
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
