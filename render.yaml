###############################################################################
# Render Blueprint — PlacementPrep
# Deploy all services at once: https://dashboard.render.com/blueprints
###############################################################################

services:
  # ── Next.js Web App ────────────────────────────────────────────────────────
  - type: web
    name: placement-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    plan: starter          # upgrade to standard for production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false          # set manually in Render dashboard
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          name: placement-redis
          type: redis
          property: connectionString
      - key: OLLAMA_FAST_URL
        fromService:
          name: placement-ollama
          type: pserv
          property: hostport
        # Will be: http://<internal-host>:<port>
        # Render private services use internal networking
      - key: OLLAMA_EMBED_URL
        fromService:
          name: placement-ollama
          type: pserv
          property: hostport
      - key: OLLAMA_SMART_URL
        fromService:
          name: placement-ollama
          type: pserv
          property: hostport
      - key: OLLAMA_BASE_URL
        fromService:
          name: placement-ollama
          type: pserv
          property: hostport
      - key: OLLAMA_FAST_MODEL
        value: phi3:mini
      - key: OLLAMA_SMART_MODEL
        value: mistral:7b-instruct-q4_0
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: OLLAMA_BANK_MODEL
        value: qwen2:0.5b
      - key: NEXT_PUBLIC_APP_URL
        sync: false          # set to your custom domain e.g. https://placement.yourdomain.com

  # ── Background Worker ──────────────────────────────────────────────────────
  - type: worker
    name: placement-worker
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: apps/worker
    plan: starter
    envVars:
      - key: REDIS_URL
        fromService:
          name: placement-redis
          type: redis
          property: connectionString
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OLLAMA_FAST_URL
        fromService:
          name: placement-ollama
          type: pserv
          property: hostport
      - key: OLLAMA_BANK_MODEL
        value: qwen2:0.5b
      - key: OLLAMA_MCQ_MODEL
        value: phi3:mini

  # ── Ollama (CPU — private, not exposed to internet) ────────────────────────
  - type: pserv
    name: placement-ollama
    runtime: docker
    dockerfilePath: render-ollama/Dockerfile
    dockerContext: render-ollama
    plan: standard          # needs at least 2GB RAM for phi3:mini
    disk:
      name: ollama-models
      mountPath: /root/.ollama
      sizeGB: 20            # model storage

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: placement-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
